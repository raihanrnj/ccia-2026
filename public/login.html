<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Operator - Cerdas Cermat Scoreboard Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Teko:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070c18;
      --bg-card: rgba(15, 23, 42, 0.78);
      --border-card: rgba(56, 189, 248, 0.22);
      --primary: #0ea5e9;
      --primary-hover: #0284c7;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --font-main: 'Outfit', sans-serif;
      --font-display: 'Teko', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(14, 165, 233, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(15, 23, 42, 0.9) 0%, #070c18 100%);
      color: var(--text-main);
      font-family: var(--font-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Ambient animated glow ring */
    .glow-ring {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, transparent 70%);
      filter: blur(60px);
      z-index: 0;
      pointer-events: none;
      animation: pulseGlow 6s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9) translateY(-10px); opacity: 0.6; }
      100% { transform: scale(1.1) translateY(10px); opacity: 0.9; }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
    }

    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-card);
      border-radius: 20px;
      padding: 40px 36px;
      box-shadow: 
        0 20px 40px rgba(0, 0, 0, 0.5),
        0 0 35px rgba(14, 165, 233, 0.12);
      transition: all 0.3s ease;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(14, 165, 233, 0.14);
      border: 1px solid rgba(14, 165, 233, 0.35);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .brand-pill-dot {
      width: 7px;
      height: 7px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .login-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 13px 16px;
      font-size: 1rem;
      font-family: inherit;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.28);
    }

    .form-input::placeholder {
      color: #64748b;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      padding: 6px;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: #f8fafc;
    }

    /* Error alert banner */
    .error-banner {
      display: none;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 20px;
      text-align: center;
    }

    .error-banner.show {
      display: block;
      animation: shake 0.35s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 18px rgba(14, 165, 233, 0.35);
      margin-top: 8px;
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, #0369a1, #0284c7);
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(14, 165, 233, 0.5);
    }

    .btn-submit:active {
      transform: translateY(1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
    }

    .back-link {
      color: #94a3b8;
      font-size: 0.88rem;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .back-link:hover {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="glow-ring"></div>

  <main class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="brand-pill">
          <span class="brand-pill-dot"></span>
          <span>Cerdas Cermat Platform</span>
        </div>
        <h1 class="login-title">Panel Operator</h1>
        <p class="login-subtitle">Masuk untuk mengelola skor regu, babak lomba, dan pengaturan layar live score.</p>
      </div>

      <div id="errorBanner" class="error-banner"></div>

      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="usernameInput">Username</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="usernameInput" 
              class="form-input" 
              placeholder="Masukkan username" 
              autocomplete="username" 
              required 
              autofocus
            >
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="passwordInput" 
              class="form-input" 
              placeholder="Masukkan password" 
              autocomplete="current-password" 
              required
            >
            <button type="button" class="toggle-pass-btn" onclick="togglePasswordVisibility()" title="Lihat/Sembunyikan Password">
              👁️
            </button>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          Masuk ke Panel Admin ➔
        </button>
      </form>

      <div class="login-footer">
        <a href="/" class="back-link">← Kembali ke Layar Display (TV)</a>
      </div>
    </div>
  </main>

  <script>
    function togglePasswordVisibility() {
      const passInput = document.getElementById('passwordInput');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(event) {
      event.preventDefault();
      const usernameInput = document.getElementById('usernameInput');
      const passwordInput = document.getElementById('passwordInput');
      const submitBtn = document.getElementById('submitBtn');
      const errorBanner = document.getElementById('errorBanner');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      errorBanner.classList.remove('show');
      errorBanner.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Memverifikasi...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          submitBtn.textContent = 'Berhasil! Mengalihkan...';
          // Store token in localStorage as backup if needed
          if (data.token) localStorage.setItem('admin_token', data.token);
          // Redirect to admin panel
          window.location.href = '/admin';
        } else {
          errorBanner.textContent = data.error || 'Username atau password salah.';
          errorBanner.classList.add('show');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Masuk ke Panel Admin ➔';
          passwordInput.value = '';
          passwordInput.focus();
        }
      } catch (err) {
        errorBanner.textContent = 'Terjadi kesalahan jaringan. Pastikan server aktif.';
        errorBanner.classList.add('show');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Masuk ke Panel Admin ➔';
      }
    }
  </script>
</body>
</html>
